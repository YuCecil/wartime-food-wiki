<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}｜戰時餐桌故事簡報</title>
<!-- 由 tools/slides.py build 從 script.md 產生，不要手改這個檔案；要改字請改 script.md，要改版面請改 templates/deck.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{
  --paper:#ECEEE8; --sheet:#F6F7F3; --ink:#1E2A3F; --indigo:#34548A; --muted:#5E6878; --line:#C7CDC4; --stamp:#B23A2E;
  --rice-ink:#7A5206; --rice-tint:#F3D98F; --meat-ink:#93304A; --meat-tint:#F5C9D3; --rule-ink:#46607F; --rule-tint:#D2DCE9;
  --market-ink:#7A4A1E; --market-tint:#E8CFB0; --life-ink:#3D6B38; --life-tint:#CFE3C4; --post-ink:#2A4677; --post-tint:#C9D5EC;
  --kai:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif; --sans:"Noto Sans TC",system-ui,sans-serif;
}
[data-cat=rice]{--cat-ink:var(--rice-ink);--cat-tint:var(--rice-tint)} [data-cat=meat]{--cat-ink:var(--meat-ink);--cat-tint:var(--meat-tint)}
[data-cat=rule]{--cat-ink:var(--rule-ink);--cat-tint:var(--rule-tint)} [data-cat=market]{--cat-ink:var(--market-ink);--cat-tint:var(--market-tint)}
[data-cat=life]{--cat-ink:var(--life-ink);--cat-tint:var(--life-tint)} [data-cat=post]{--cat-ink:var(--post-ink);--cat-tint:var(--post-tint)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.deck{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
.slide{display:none;width:min(1100px,100%);aspect-ratio:16/9;max-height:100%;background:var(--sheet);border:1px solid var(--line);
  border-top:6px solid var(--cat-ink)}
.slide.active{display:flex}
.inner{flex:1;overflow:hidden;padding:44px 64px;display:flex;flex-direction:column;justify-content:center;font-size:clamp(17px,1.75vw,22px);line-height:1.75}
h1,h2{font-family:var(--kai);font-weight:700;line-height:1.3;margin:0 0 .7em;text-wrap:balance}
h1{font-size:2.3em} h2{font-size:1.55em;color:var(--ink)}
p{margin:0 0 .65em;max-width:40em} strong{color:var(--cat-ink)}
.cites{font-size:.72em;color:var(--muted);white-space:normal}
.cite{color:var(--indigo);text-decoration:underline;text-underline-offset:2px}
.cite:hover{color:var(--ink)}
/* 封面：配給券 */
.cover{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center;height:100%}
.ticket{display:flex;gap:22px;align-items:flex-start;background:var(--cat-tint);padding:28px 30px;border-left:2px dashed var(--cat-ink)}
.stub{flex:none;width:58px;height:58px;border-radius:50%;border:2px solid var(--cat-ink);color:var(--cat-ink);display:grid;place-items:center;
  font-family:var(--kai);font-size:30px;font-weight:700}
.series{font-size:.8em;color:var(--cat-ink);margin-bottom:.4em;letter-spacing:.05em}
.sub{font-size:1.05em}
.meta{font-size:.75em;color:var(--muted);margin:0}
.cover-img{width:100%;height:100%;max-height:100%;object-fit:cover;border:1px solid var(--line)}
/* 學習目標、自我檢查 */
ol.goals,ol.qa{margin:0;padding-left:1.4em} ol.goals li{margin:.35em 0;padding-left:.2em}
ol.qa li{margin:.2em 0 .7em} ol.qa p{margin:0}
details summary{cursor:pointer;color:var(--indigo);font-size:.85em}
details p{font-size:.9em;color:var(--ink);margin-top:.3em!important}
/* 大數字：全份簡報唯一使用印泥紅的地方 */
.big{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:.4em}
.stamp-num{font-family:var(--kai);font-size:3em;font-weight:700;color:var(--stamp);line-height:1.1}
.big-label{color:var(--muted)}
/* 兩種說法並列 */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:.6em}
.side{border-top:1px solid var(--line);padding-top:.6em}
.who{font-family:var(--kai);font-weight:700;color:var(--cat-ink);margin-bottom:.3em}
blockquote{margin:0;font-family:var(--kai);font-size:1.15em}
figure{margin:0 0 .6em;display:flex;gap:24px;align-items:flex-end}
figure img{max-height:46vh;max-width:55%;border:1px solid var(--line)}
figcaption{font-size:.8em;color:var(--muted)}
/* 下方工具列 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px 14px;font-size:14px;color:var(--muted)}
.bar a{color:var(--indigo)}
.nav{display:flex;align-items:center;gap:10px}
.nav button{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);min-width:44px;min-height:40px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:focus-visible,.cite:focus-visible,summary:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.count{font-variant-numeric:tabular-nums;min-width:4em;text-align:center}
.progress{height:3px;background:var(--line)} .progress span{display:block;height:100%;background:var(--cat-ink);transition:width .2s}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
/* 手機：直式全螢幕，一頁一畫面 */
@media (max-width:760px){
  .deck{padding:0}
  .slide{aspect-ratio:auto;height:100%;width:100%;border-left:0;border-right:0}
  .inner{padding:22px 18px;font-size:16px;line-height:1.7;justify-content:flex-start}
  h1{font-size:1.8em} h2{font-size:1.35em}
  .cover{grid-template-columns:1fr;gap:16px;align-content:start}
  .cover-img{height:auto;max-height:30vh}
  .ticket{padding:18px}
  .stub{width:44px;height:44px;font-size:22px}
  .compare{grid-template-columns:1fr;gap:10px}
  figure{flex-direction:column;align-items:flex-start;gap:6px} figure img{max-width:100%;max-height:24vh}
  .stamp-num{font-size:2.4em}
  .bar{padding:8px 12px 12px;font-size:13px} .bar .wiki{display:none}
}
/* 吉祥物：每次開啟隨機挑角色與頁面，放在頁角，不擋字 */
.slide{position:relative}
.mascot{position:absolute;bottom:14px;height:clamp(84px,17%,150px);width:auto;pointer-events:none;user-select:none}
.mascot.r{right:18px} .mascot.l{left:18px}
.mascot.flip{transform:scaleX(-1)}
</style>
</head>
<body data-cat="{{CAT}}">
<main class="deck" id="deck">
{{SLIDES}}
</main>
<div class="progress" aria-hidden="true"><span id="prog"></span></div>
<nav class="bar" aria-label="翻頁">
  <a href="../../index.html">← 所有簡報</a>
  <div class="nav">
    <button id="prev" aria-label="上一頁">←</button>
    <span class="count" id="count" aria-live="polite">1 / {{TOTAL}}</span>
    <button id="next" aria-label="下一頁">→</button>
  </div>
  <a class="wiki" href="{{WIKI}}" target="_blank" rel="noopener">這個故事的 wiki 頁</a>
</nav>
<script>
const slides=[...document.querySelectorAll('.slide')];let cur=1;
function go(n){cur=Math.max(1,Math.min(slides.length,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur-1));
  document.getElementById('count').textContent=cur+' / '+slides.length;
  document.getElementById('prog').style.width=(cur/slides.length*100)+'%';
  document.getElementById('prev').disabled=cur===1;document.getElementById('next').disabled=cur===slides.length;
  history.replaceState(null,'','#'+cur);}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.closest('summary'))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(1); if(e.key==='End')go(slides.length);});
let sx=null,sy=null;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(cur+(dx<0?1:-1));sx=null;},{passive:true});
go(parseInt(location.hash.slice(1))||1);

/* 吉祥物清單由 tools/slides.py build 從 assets/mascots/ 產生 */
(()=>{const M={{MASCOTS}};if(!M.length)return;
const pages=[...document.querySelectorAll('.slide')].filter(s=>!s.classList.contains('layout-cover'));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const n=Math.min(pages.length,3+Math.floor(Math.random()*2));
pages.sort(()=>Math.random()-.5).slice(0,n).forEach(s=>{const i=new Image();i.src=pick(M);i.alt='';i.className='mascot r'+(Math.random()<.3?' flip':'')  /* 只放右下角：左下角在字多的頁會擋到字（已實測） */;s.appendChild(i)})})();
</script>
</body>
</html>
